<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0B0F"/>
      <stop offset="100%" stop-color="#161823"/>
    </linearGradient>
    <linearGradient id="que-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- SYNQUE text centered -->
  <text x="256" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">
    <tspan fill="#F5F5F7">SYN</tspan><tspan fill="url(#que-grad)">QUE</tspan>
  </text>

  <!-- Slogan -->
  <text x="256" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#6E6E73">
    ORCHESTRATE YOUR SOCIAL
  </text>
</svg>
