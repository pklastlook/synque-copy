<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0B0F"/>
      <stop offset="100%" stop-color="#161823"/>
    </linearGradient>
    <linearGradient id="que-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5E5CE6" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- Rounded squircle tile background (iOS app icon proportion) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Subtle accent glow behind the wordmark -->
  <rect x="96" y="176" width="320" height="160" rx="32" fill="url(#glow-grad)"/>

  <!-- SYNQUE wordmark centered (bolder + larger for icon legibility) -->
  <text x="256" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3">
    <tspan fill="#F5F5F7">SYN</tspan><tspan fill="url(#que-grad)">QUE</tspan>
  </text>
</svg>
