<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark canvas — deep near-black with a slight indigo tint -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>

    <!-- Disc gradient — Apple system blue → indigo (dark-mode brand pair) -->
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>

    <!-- Radial highlight — "liquid glass" light catch on the disc -->
    <radialGradient id="discShine" cx="32%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer bloom for the disc -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded-square background — maskable PWA-safe -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle decorative rings inside the safe zone -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(94,92,230,0.10)" stroke-width="2"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="rgba(10,132,255,0.06)" stroke-width="1.5"/>

  <!-- SYNQUE "Sync Pulse" mark — centered, scaled to ~72% of canvas -->
  <!-- Mark in local coords spans (8,8)-(56,56); center at (32,32). -->
  <g transform="translate(256 256) scale(7.2) translate(-32 -32)">
    <!-- Outer radar pulse rings (static in icon — animation is in the web app) -->
    <circle cx="32" cy="32" r="22" fill="none" stroke="#0A84FF" stroke-width="0.55" stroke-opacity="0.55"/>
    <circle cx="32" cy="32" r="25.4" fill="none" stroke="#5E5CE6" stroke-width="0.45" stroke-opacity="0.32"/>

    <!-- Static thin orbit ring — frames the pulse -->
    <circle cx="32" cy="32" r="22" fill="none" stroke="#0A84FF" stroke-width="0.9" stroke-opacity="0.22"/>

    <!-- Inner gradient disc with glow + "S" overlay -->
    <g filter="url(#glow)">
      <circle cx="32" cy="32" r="15" fill="url(#discGrad)"/>
      <circle cx="32" cy="32" r="15" fill="url(#discShine)"/>
      <!-- The "S" — continuous sync flow stroke -->
      <path d="M 38 24 C 38 16, 22 16, 24 32 C 24 36, 40 28, 40 32 C 42 48, 26 48, 26 40"
            fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="3.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
